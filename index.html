<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание профиля</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #141414;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1f1f1f;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { margin-bottom: 20px; color: #00ff88; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; color: #bbb; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
        }
        input[type="file"] { display: none; }
        .avatar-label {
            display: inline-block;
            padding: 10px 15px;
            background: #333;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.3s;
        }
        .avatar-label:hover { background: #444; }
        .avatar-preview {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin: 15px auto 0 auto;
            display: none;
            border: 3px solid #00ff88;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #00ff88;
            border: none;
            border-radius: 6px;
            color: #141414;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #00dd77; }
        .error-msg { color: #ff4444; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Создание профиля</h2>
    
    <!-- Выбор аватарки из галереи -->
    <div class="form-group">
        <label>Выберите аватарку:</label>
        <label for="avatarInput" class="avatar-label">Открыть галерею</label>
        <input type="file" id="avatarInput" accept="image/*">
        <br>
        <img id="avatarPreview" class="avatar-preview" src="" alt="Превью">
    </div>

    <!-- Ввод игрового ника -->
    <div class="form-group">
        <label for="username">Ваш игровой никнейм:</label>
        <input type="text" id="username" placeholder="Придумайте ник...">
    </div>

    <button onclick="saveProfile()">Войти в игру</button>
    <div class="error-msg" id="errorMsg"></div>
</div>

<script>
    let avatarBase64 = ""; // Переменная для хранения картинки

    // Проверка при запуске страницы
    window.onload = function() {
        // Если в браузере уже сохранен ник, сразу перекидываем в игру
        if (localStorage.getItem('savedNickname')) {
            window.location.href = "game.html";
        }
    };

    // Чтение картинки из галереи устройства
    document.getElementById('avatarInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                avatarBase64 = event.target.result; // Конвертируем в строку
                const preview = document.getElementById('avatarPreview');
                preview.src = avatarBase64;
                preview.style.display = 'block'; // Показываем превью круглого аватара
            };
            reader.readAsDataURL(file);
        }
    });

    // Сохранение и вход
    function saveProfile() {
        const nickname = document.getElementById('username').value.trim();
        const errorMsg = document.getElementById('errorMsg');

        if (!nickname) {
            errorMsg.innerText = "Пожалуйста, введите свой ник!";
            return;
        }

        // Сохраняем ник и аватарку навсегда в память браузера
        localStorage.setItem('savedNickname', nickname);
        if (avatarBase64) {
            localStorage.setItem('savedAvatar', avatarBase64);
        } else {
            // Если аватарку не выбрали, ставим стандартную аватарку-заглушку
            localStorage.setItem('savedAvatar', 'https://placeholder.com' + nickname[0].toUpperCase());
        }

        // Переходим на страницу игры
        window.location.href = "game.html";
    }
</script>
</body>
</html>
