<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск друзей</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #141414;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .window {
            background: #1f1f1f;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
        }
        h2 { color: #00ff88; margin-top: 0; text-align: center; }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
        }
        button {
            padding: 10px 15px;
            background: #00ff88;
            border: none;
            border-radius: 6px;
            color: #141414;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #00dd77; }
        .user-card {
            display: flex;
            align-items: center;
            background: #2a2a2a;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            justify-content: space-between;
        }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00ff88;
        }
        .nickname { font-size: 16px; font-weight: bold; }
        .list-title { margin-top: 25px; color: #bbb; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .empty-msg { color: #666; font-style: italic; text-align: center; margin-top: 10px; }
        .nav-btn {
            background: #333;
            color: #fff;
            margin-top: 15px;
            width: 100%;
            padding: 10px;
        }
        .nav-btn:hover { background: #444; }
    </style>
</head>
<body>

<div class="window">
    <h2>🤝 Поиск друзей</h2>
    
    <!-- Поисковая строка -->
    <div class="search-box">
        <input type="text" id="searchQuery" placeholder="Введите ник игрока...">
        <button onclick="searchUser()">Найти</button>
    </div>

    <!-- Результат поиска -->
    <div id="searchResult"></div>

    <!-- Список моих друзей -->
    <div class="list-title">Мои друзья</div>
    <div id="friendsList">
        <div class="empty-msg">Список друзей пуст</div>
    </div>

    <button class="nav-btn" onclick="window.location.href='game.html'">🎮 Вернуться в меню</button>
</div>

<!-- Подключаем Firebase (базу данных) -->
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>

<script>
    // КОНФИГУРАЦИЯ FIREBASE (Сюда мы вставим твои ключи, когда ты создашь базу)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_://firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT_://firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_://appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    
    // Инициализация базы данных (пока ключи пустые, будет выдавать ошибку, это нормально)
    if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
        firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    // Получаем текущего игрока из localStorage (созданного в index.html)
    const currentUser = localStorage.getItem('currentUser') || "Гость";

    // Функция поиска реального человека в базе данных Firebase
    function searchUser() {
        const query = document.getElementById('searchQuery').value.trim();
        const resultContainer = document.getElementById('searchResult');
        resultContainer.innerHTML = "";

        if (!query) return alert("Введите ник для поиска!");
        if (query === currentUser) return alert("Вы не можете искать самого себя!");

        // Ищем пользователя в ветке "users" в нашей базе данных
        database.ref('users/' + query).once('value').then((snapshot) => {
            if (snapshot.exists()) {
                const userData = snapshot.val();
                
                // Создаем карточку найденного пользователя
                resultContainer.innerHTML = `
                    <div class="list-title">Результат поиска:</div>
                    <div class="user-card">
                        <div class="user-info">
                            <img src="${userData.avatar || 'https://placeholder.com'}" class="avatar">
                            <span class="nickname">${userData.username}</span>
                        </div>
                        <button onclick="addFriend('${userData.username}')">Добавить</button>
                    </div>
                `;
            } else {
                resultContainer.innerHTML = `<div class="empty-msg">Пользователь с ником "${query}" не найден</div>`;
            }
        }).catch((error) => {
            console.error(error);
            // Если Firebase еще не настроен, показываем симуляцию для теста:
            simulateSearch(query, resultContainer);
        });
    }

    // Симуляция поиска (работает локально, пока не подключен Firebase)
    function simulateSearch(query, container) {
        const localUser = localStorage.getItem('user_' + query);
        if (localUser) {
            const userData = JSON.parse(localUser);
            container.innerHTML = `
                <div class="list-title">Результат поиска (Локально):</div>
                <div class="user-card">
                    <div class="user-info">
                        <img src="${userData.avatar}" class="avatar">
                        <span class="nickname">${userData.username}</span>
                    </div>
                    <button onclick="addFriend('${userData.username}')">Добавить</button>
                </div>
            `;
        } else {
            container.innerHTML = `<div class="empty-msg">Пользователь не найден. (Подключите Firebase для глобального поиска)</div>`;
        }
    }

    // Функция добавления в список друзей
    function addFriend(friendName) {
        let friends = JSON.parse(localStorage.getItem('friends_' + currentUser)) || [];
        
        if (friends.includes(friendName)) {
            alert("Этот игрок уже у вас в друзьях!");
            return;
        }

        friends.push(friendName);
        localStorage.setItem('friends_' + currentUser, JSON.stringify(friends));
        alert(`${friendName} добавлен в друзья!`);
        loadFriendsList();
    }

    // Отображение списка друзей
    function loadFriendsList() {
        const friendsList = document.getElementById('friendsList');
        let friends = JSON.parse(localStorage.getItem('friends_' + currentUser)) || [];

        if (friends.length === 0) {
            friendsList.innerHTML = '<div class="empty-msg">Список друзей пуст</div>';
            return;
        }

        friendsList.innerHTML = "";
        friends.forEach(friend => {
            // Для каждого друга берем данные
            const savedData = localStorage.getItem('user_' + friend);
            let avatar = "https://placeholder.com";
            if (savedData) {
                avatar = JSON.parse(savedData).avatar;
            }

            friendsList.innerHTML += `
                <div class="user-card">
                    <div class="user-info">
                        <img src="${avatar}" class="avatar">
                        <span class="nickname">${friend}</span>
                    </div>
                    <button style="background: #ff4444; color: white;" onclick="removeFriend('${friend}')">❌</button>
                </div>
            `;
        });
    }

    // Удаление из друзей
    function removeFriend(friendName) {
        let friends = JSON.parse(localStorage.getItem('friends_' + currentUser)) || [];
        friends = friends.filter(name => name !== friendName);
        localStorage.setItem('friends_' + currentUser, JSON.stringify(friends));
        loadFriendsList();
    }

    // Загружаем друзей при открытии страницы
    loadFriendsList();
</script>
</body>
</html>
